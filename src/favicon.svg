<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop id="s1" offset="0" stop-color="#0e6b62"/>
      <stop id="s2" offset="1" stop-color="#c46b3a"/>
    </linearGradient>
    <style>
      /* Brighter Desert Oasis accents when the OS is in dark mode,
         matching the site's .dark token values */
      @media (prefers-color-scheme: dark) {
        #s1 { stop-color: #3eb3a4; }
        #s2 { stop-color: #dd8d52; }
      }
    </style>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#g)"/>
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="monospace" font-weight="700" font-size="27" fill="#0e1014">HG</text>
</svg>
