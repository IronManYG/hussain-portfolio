<!DOCTYPE html>
<!-- linkedin_banner — 1584x396 profile banner. Isometric platform stack
     (phone / desktop / watch / tablet on a shared-codebase line) plus a short
     mono tagline, Desert Oasis light. The left third stays empty: LinkedIn
     overlays the profile photo over the bottom-left ~280x280 region. The
     tagline sits in the upper-left void, inside the tighter mobile crop.
     Render via generate.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_brand.css">
<style>
    body { width: 1584px; height: 396px; position: relative; }
    svg { position: absolute; inset: 0; }
    .tagline {
        position: absolute;
        left: 645px;
        top: 88px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-family: 'JetBrains Mono', monospace;
        letter-spacing: 0.01em;
    }
    .tagline .t1 { font-size: 36px; font-weight: 700; color: var(--accent); }
    .tagline .t2 { font-size: 26px; font-weight: 500; color: var(--muted); }
</style>
</head>
<body class="grain-light">
<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
    <!-- shared-codebase line through the tile centers -->
    <polyline points="610,358 700,332 946,262 1192,192 1438,122 1530,96"
              fill="none" stroke="#1c1c1f" stroke-opacity="0.30"
              stroke-width="1.5" vector-effect="non-scaling-stroke"/>

    <!-- tile 1: phone -->
    <g transform="translate(700,332) scale(1,0.5) rotate(45)">
        <rect x="-100" y="-100" width="200" height="200" rx="20" fill="#0e6b62"/>
        <rect x="-39" y="-63" width="78" height="127" rx="13" fill="none"
              stroke="#f5efe6" stroke-width="3.5" vector-effect="non-scaling-stroke"/>
        <line x1="-13" y1="46" x2="13" y2="46"
              stroke="#f5efe6" stroke-width="3.5" stroke-linecap="round"
              vector-effect="non-scaling-stroke"/>
    </g>

    <!-- tile 2: desktop -->
    <g transform="translate(946,262) scale(1,0.5) rotate(45)">
        <rect x="-100" y="-100" width="200" height="200" rx="20" fill="#0e6b62"/>
        <rect x="-61" y="-55" width="122" height="78" rx="9" fill="none"
              stroke="#f5efe6" stroke-width="3.5" vector-effect="non-scaling-stroke"/>
        <line x1="0" y1="23" x2="0" y2="48"
              stroke="#f5efe6" stroke-width="3.5" vector-effect="non-scaling-stroke"/>
        <line x1="-26" y1="51" x2="26" y2="51"
              stroke="#f5efe6" stroke-width="3.5" stroke-linecap="round"
              vector-effect="non-scaling-stroke"/>
    </g>

    <!-- tile 3: watch -->
    <g transform="translate(1192,192) scale(1,0.5) rotate(45)">
        <rect x="-100" y="-100" width="200" height="200" rx="20" fill="#0e6b62"/>
        <circle cx="0" cy="0" r="43" fill="none"
                stroke="#f5efe6" stroke-width="3.5" vector-effect="non-scaling-stroke"/>
        <rect x="-16" y="-66" width="32" height="13" rx="6" fill="none"
              stroke="#f5efe6" stroke-width="3.5" vector-effect="non-scaling-stroke"/>
        <rect x="-16" y="53" width="32" height="13" rx="6" fill="none"
              stroke="#f5efe6" stroke-width="3.5" vector-effect="non-scaling-stroke"/>
    </g>

    <!-- tile 4: tablet, with the single terracotta accent -->
    <g transform="translate(1438,122) scale(1,0.5) rotate(45)">
        <rect x="-100" y="-100" width="200" height="200" rx="20" fill="#0e6b62"/>
        <rect x="-57" y="-73" width="114" height="146" rx="13" fill="none"
              stroke="#f5efe6" stroke-width="3.5" vector-effect="non-scaling-stroke"/>
        <circle cx="73" cy="-73" r="11" fill="#c46b3a"/>
    </g>
</svg>

<div class="tagline">
    <span class="t1">one Kotlin codebase</span>
    <span class="t2">every screen</span>
</div>
</body>
</html>
