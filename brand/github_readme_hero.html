<!DOCTYPE html>
<!-- github_readme_hero — 1280x320 profile-README hero. Terminal prompt line,
     Desert Oasis dark. Render via generate.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_brand.css">
<style>
    body {
        width: 1280px;
        height: 320px;
        display: flex;
        align-items: center;
    }
    .line {
        margin-left: 102px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 40px;
        font-weight: 500;
        padding-bottom: 22px;
        border-bottom: 2px solid var(--d-accent);
        white-space: nowrap;
    }
    .prompt { color: var(--d-accent); }
    .name { color: var(--d-text); }
    .flags { color: var(--d-muted); }
    .cursor {
        display: inline-block;
        width: 21px;
        height: 40px;
        margin-left: 16px;
        transform: translateY(5px);
        background: var(--d-accent-2);
    }
</style>
</head>
<body class="grain-dark">
    <div class="line"><span class="prompt">&gt;</span> <span class="name">hussain.gaddal</span> <span class="flags">--kotlin --multiplatform</span><span class="cursor"></span></div>
</body>
</html>
