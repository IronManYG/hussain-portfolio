<!DOCTYPE html>
<!-- og_image — 1200x630 Open Graph / Twitter card. Centered editorial card,
     Desert Oasis light. Render via generate.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_brand.css">
<style>
    body {
        width: 1200px;
        height: 630px;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .frame {
        position: absolute;
        inset: 26px;
        border: 2px solid var(--accent);
        border-radius: 4px;
        opacity: 0.85;
    }
    .chip {
        width: 86px;
        height: 86px;
        border-radius: 22px;
        font-size: 36px;
    }
    h1 {
        margin-top: 34px;
        font-size: 80px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text);
    }
    .tagline {
        margin-top: 14px;
        font-size: 28px;
        font-weight: 500;
        color: var(--muted);
    }
    .tagline .sep { color: var(--accent); font-weight: 600; }
    .url {
        position: absolute;
        bottom: 62px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: 'JetBrains Mono', monospace;
        font-size: 19px;
        font-weight: 400;
        letter-spacing: 0.02em;
        color: var(--accent);
    }
</style>
</head>
<body class="grain-light">
    <div class="frame"></div>
    <div class="chip">HG</div>
    <h1>Hussain Gaddal</h1>
    <div class="tagline">Android Developer <span class="sep">&middot;</span> Kotlin <span class="sep">&middot;</span> KMP/CMP</div>
    <div class="url">ironmanyg.github.io/hussain-portfolio</div>
</body>
</html>
