name: Deploy Eleventy site to Pages

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Single source of truth, shared with the other workflow and with
          # `nvm use` locally — the version was duplicated in both files.
          node-version-file: ".nvmrc"
          cache: npm
          
      # `ci` not `install`: `install` is free to resolve newer versions than
      # package-lock.json pins, so a deploy could pick up a dependency change
      # nobody committed. `ci` installs the lockfile exactly and fails if the
      # two have drifted.
      - name: Install dependencies
        run: npm ci

      - name: Build with Eleventy and Tailwind
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
