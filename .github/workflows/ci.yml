name: CI

# deploy.yml only runs on push to main, so until this existed nothing validated
# a pull request — a broken build (or an icon class with no rule, which
# build:check catches) could only fail once it was already deploying.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # `ci` not `install`: installs exactly what package-lock.json pins and
      # fails if the two have drifted, so a PR builds against the same
      # dependency tree the deploy will use.
      - name: Install dependencies
        run: npm ci

      # Runs build:check (icon classes), build:css and build:eleventy.
      - name: Build
        run: npm run build
